<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Consensus Benchmark Dashboard{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2em auto;
           padding: 0 1.2em; color: #222; line-height: 1.45; }
    h1 { margin-bottom: 0.2em; }
    h2 { margin-top: 2em; padding-top: 1em; border-top: 1px solid #eee; }
    nav { padding-bottom: 1em; border-bottom: 1px solid #eee; margin-bottom: 1.5em; }
    nav a { color: #2a5db0; text-decoration: none; margin-right: 1.2em; }
    nav a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.95em; }
    th, td { padding: 0.45em 0.75em; border: 1px solid #ddd; text-align: left; }
    th { background: #f4f4f7; font-weight: 600; }
    tbody tr:nth-child(odd) { background: #fafafa; }
    .significant     { color: #1c8746; font-weight: 600; }
    .not-significant { color: #888;    }
    .skipped         { color: #b56300; font-style: italic; }
    .plots { display: flex; gap: 1.2em; flex-wrap: wrap; margin: 1em 0; }
    .plots img { max-width: 480px; width: 100%; border: 1px solid #eee; border-radius: 4px; }
    code { background: #f0f0f5; padding: 0.05em 0.35em; border-radius: 3px; font-size: 0.95em; }
    .empty { color: #888; padding: 2em 0; text-align: center; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Experiments</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
