name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Las pruebas de integración con Docker se omiten automáticamente en el runner.
      - run: python -m pytest tests/ -q

  site-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: El JSON del sitio coincide con los resultados finales
        run: |
          python scripts/build_site_data.py
          git diff --exit-code site/data/results.json
